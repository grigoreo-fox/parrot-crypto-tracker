name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run validate:openapi
      - run: npm run test:coverage
      - name: Generate coverage badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const pct = require('./coverage/coverage-summary.json').total.lines.pct;
          if (typeof pct !== 'number' || !Number.isFinite(pct) || pct < 0 || pct > 100) throw new Error('Invalid line coverage');
          const color = pct >= 80 ? '#4c1' : pct >= 60 ? '#dfb317' : '#e05d44';
          fs.mkdirSync('coverage-badge', { recursive: true });
          fs.writeFileSync('coverage-badge/coverage.svg', `<svg xmlns="http://www.w3.org/2000/svg" width="120" height="20" role="img" aria-label="coverage: ${pct}%"><rect width="120" height="20" rx="3" fill="#555"/><path fill="${color}" d="M70 0h47a3 3 0 0 1 3 3v14a3 3 0 0 1-3 3H70z"/><g fill="#fff" text-anchor="middle" font-family="Verdana,sans-serif" font-size="11"><text x="35" y="14">coverage</text><text x="95" y="14">${pct}%</text></g></svg>`);
          NODE
      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: coverage-badge
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: ignore

  deploy-badge:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy coverage badge
        id: deployment
        uses: actions/deploy-pages@v4
